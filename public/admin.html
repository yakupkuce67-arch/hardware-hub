<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Yönetim Paneli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="padding: 40px; max-width: 900px; margin: 0 auto;">

    <!-- Admin Giriş Formu -->
    <div id="admin-login-box" class="card">
        <h2>👑 Admin Panel Girişi</h2>
        <p style="color:#94a3b8; font-size:0.9rem; margin-bottom:15px;">Yönetici yetkisi olan hesabınızla giriş yapın.</p>
        <input type="text" id="admin-username" placeholder="Admin Kullanıcı Adı" class="input-field">
        <input type="password" id="admin-password" placeholder="Şifre" class="input-field">
        <button onclick="adminLogin()" style="background-color: #f59e0b;">Panel Girişi Yap</button>
    </div>

    <!-- Admin Paneli -->
    <div id="admin-dashboard" class="card hidden" style="margin-top:20px;">
        <h2>📊 Kayıtlı Kullanıcılar ve Yönetim</h2>
        <p style="color:#94a3b8; font-size:0.9rem; margin-bottom:15px;">Sistemde kayıtlı kullanıcı ve admin listesi:</p>
        
        <table style="width:100%; border-collapse: collapse; margin-top:15px; color:#fff;">
            <thead>
                <tr style="border-bottom: 2px solid #334155; text-align: left;">
                    <th style="padding:10px;">ID</th>
                    <th style="padding:10px;">Kullanıcı Adı</th>
                    <th style="padding:10px;">Rol</th>
                    <th style="padding:10px; text-align:center;">İşlem</th>
                </tr>
            </thead>
            <tbody id="user-table-body">
                <!-- Kullanıcılar buraya gelecek -->
            </tbody>
        </table>

        <button onclick="adminLogout()" style="margin-top: 20px; background-color: #64748b;">Çıkış Yap</button>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        async function adminLogin() {
            const username = document.getElementById('admin-username').value;
            const password = document.getElementById('admin-password').value;

            const response = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok && data.role === 'admin') {
                localStorage.setItem('adminToken', data.token);
                loadDashboard();
            } else {
                alert(data.error || 'Bu alana giriş yetkiniz yok!');
            }
        }

        async function loadDashboard() {
            const token = localStorage.getItem('adminToken');
            if (!token) return;

            const response = await fetch(`${API_URL}/admin/users`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.ok) {
                const data = await response.json();
                document.getElementById('admin-login-box').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');

                const tbody = document.getElementById('user-table-body');
                tbody.innerHTML = '';
                data.users.forEach(u => {
                    tbody.innerHTML += `
                        <tr style="border-bottom: 1px solid #334155;">
                            <td style="padding:10px;">${u.id}</td>
                            <td style="padding:10px;"><strong>${u.username}</strong></td>
                            <td style="padding:10px; color:${u.role === 'admin' ? '#f59e0b' : '#38bdf8'};">${u.role}</td>
                            <td style="padding:10px; text-align:center;">
                                <button onclick="deleteUser(${u.id}, '${u.username}')" style="background-color:#ef4444; padding:6px 12px; font-size:0.8rem; width:auto;">Sil</button>
                            </td>
                        </tr>
                    `;
                });
            }
        }

        async function deleteUser(userId, username) {
            if (!confirm(`${username} isimli kullanıcıyı (veya admini) silmek istediğinize emin misiniz?`)) return;

            const token = localStorage.getItem('adminToken');
            const response = await fetch(`${API_URL}/admin/users/${userId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            const data = await response.json();
            if (response.ok) {
                alert(data.message);
                loadDashboard(); // Tabloyu yenile
            } else {
                alert(data.error);
            }
        }

        function adminLogout() {
            localStorage.removeItem('adminToken');
            location.reload();
        }

        window.onload = loadDashboard;
    </script>
</body>
</html>
